<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- BogglTrack app icon — tile composition for macOS/web -->
  <!-- Warm off-white background, squircle-friendly corner radius handled by macOS mask -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#FAFAFA"/>

  <!-- Stopwatch body -->
  <g transform="translate(512, 540)">
    <!-- Outer ring -->
    <circle r="268" fill="none" stroke="#18181B" stroke-width="56"/>

    <!-- 12 o'clock tick -->
    <line x1="0" y1="-270" x2="0" y2="-220"
          stroke="#18181B" stroke-width="28" stroke-linecap="round"/>

    <!-- Minute hand pointing up-right (1 o'clock-ish) — progress -->
    <line x1="0" y1="0" x2="138" y2="-170"
          stroke="#18181B" stroke-width="32" stroke-linecap="round"/>

    <!-- Pivot dot -->
    <circle r="18" fill="#18181B"/>

    <!-- Letter B inside, lower portion -->
    <g transform="translate(-64, 70) scale(0.9)">
      <path d="
        M 0 0
        L 0 200
        L 68 200
        Q 128 200 128 152
        Q 128 118 100 102
        Q 122 86 122 60
        Q 122 22 68 22
        L 24 22
        L 24 0
        Z
        M 24 56
        L 68 56
        Q 96 56 96 76
        Q 96 96 68 96
        L 24 96
        Z
        M 24 130
        L 68 130
        Q 100 130 100 152
        Q 100 173 68 173
        L 24 173
        Z"
        fill="#18181B" fill-rule="evenodd"/>
    </g>
  </g>

  <!-- Stopwatch top crown button -->
  <rect x="480" y="168" width="64" height="72" rx="14" fill="#18181B"/>
  <rect x="496" y="140" width="32" height="36" rx="8" fill="#18181B"/>

  <!-- Upward arrow arcing out of the watch (growth/tracking) -->
  <path d="M 320 790
           C 360 650, 480 520, 780 360"
        fill="none"
        stroke="#18181B"
        stroke-width="62"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <polygon points="790,332 880,340 848,430" fill="#18181B"/>
</svg>
